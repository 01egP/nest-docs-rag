services:
  postgres:
    # Postgres 17 with the pgvector extension preinstalled
    image: pgvector/pgvector:pg17
    container_name: nest-docs-rag-postgres
    restart: unless-stopped
    environment:
      # Same defaults as apps/api/src/config.ts; credentials are required
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-rag}
    ports:
      # Loopback only: the database is not reachable from the network
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg-data:
